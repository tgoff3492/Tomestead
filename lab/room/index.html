<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140d08">
  <meta name="robots" content="noindex">
  <title>Tomestead · The Reading Room (test page)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../room/room.css?v=20261127205424">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #140d08; color: #efe3c8; font-family: "Alegreya Sans", sans-serif; }
  </style>
</head>
<body>
  <!-- A test page for the 3D room on its own (reads the books saved in this browser).
       The app itself loads the same room from /room/. -->
  <div id="room3d" class="rm">
    <canvas id="rm-scene" aria-label="A 3D reading room with a bookcase, a desk, a fireplace and a magic tome"></canvas>
    <div id="rm-veil" class="veil"><div class="veil-title">Tomestead</div><div class="veil-sub" id="rm-veil-sub">Lighting the lamps…</div></div>
    <header class="top">
      <a class="back" href="../../">← Tomestead</a>
      <div class="label">The Reading Room <span>test page</span></div>
      <button class="round" id="rm-light" type="button" aria-label="Switch to night">☾</button>
    </header>
    <nav class="stations" aria-label="Go to">
      <button type="button" data-go="room" aria-pressed="true">Room</button>
      <button type="button" data-go="shelf">Shelf</button>
      <button type="button" data-go="desk">Desk</button>
      <button type="button" data-go="hearth">Fireside</button>
      <button type="button" data-go="tome">Tome</button>
      <button type="button" data-go="paper" aria-label="Paper: today’s literary question">Paper</button>
    </nav>
    <div class="hint" id="rm-hint">Drag to look around · tap things</div>
    <section class="card" id="rm-card" hidden aria-live="polite">
      <button class="card-x" type="button" aria-label="Close">×</button>
      <div id="rm-card-body"></div>
    </section>
    <button class="perf-btn" id="rm-perf-btn" type="button" aria-label="Speed check" aria-expanded="false">⏱</button>
    <div class="perf" id="rm-perf" hidden></div>
    <div class="nogl" id="rm-nogl" hidden>
      <p>This device can't show the 3D room (WebGL is off or unavailable).</p>
      <p>In the app, this is where you'd get the classic bookcase instead.</p>
      <a href="../../">Back to Tomestead</a>
    </div>
  </div>
  <script src="../../quotes.js"></script>
  <script src="../../trivia.js"></script>
  <script src="../../authors.js"></script>
  <script type="module" src="../../room/room.js?v=20261127205424"></script>
</body>
</html>
