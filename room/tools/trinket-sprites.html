<!doctype html><html><body style="margin:0;background:#888">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const DESK = new URLSearchParams(location.search).get('set') === 'desk';
const CAT = await (await fetch(DESK ? './desk.json' : './trinkets.json')).json();
const PPC = 16.4;               // pixels per centimetre (2 × the classic art's 8.2 units per cm)
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
// lit from the upper left and a little in front, like every piece of the classic art
const key = new THREE.DirectionalLight('#ffe9c8', 2.6); key.position.set(-0.75, 2.4, 1.0); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.blurSamples = 16; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -0.5, right: 0.5, top: 0.5, bottom: -0.5, near: 0.1, far: 5 });
scene.add(key);
const fill = new THREE.DirectionalLight('#c8d4ff', 0.35); fill.position.set(1.5, 0.6, 1); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.42 }));
ground.receiveShadow = true; scene.add(ground);
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const out = {};
const EL = THREE.MathUtils.degToRad(DESK ? 32 : 9);   // a table is seen from above, a shelf nearly straight on     // looking very slightly down, as you look at a shelf
for (const [k, c] of Object.entries(CAT)) {
  const g = await L.loadAsync(DESK ? `./m/${c.file}.glb` : `./tr/${k}.glb`);
  const m = g.scene;
  if (c.parts) { m.updateMatrixWorld(true); for (const o of [...m.children]) { const cc = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()); o.position.x -= cc.x; o.position.z -= cc.z; } }
  if (c.lie) m.rotation.x = -Math.PI / 2;
  m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const inner = new THREE.Group(); const turn = new THREE.Group(); turn.add(m); inner.add(turn); turn.rotation.y = c.ry || 0;
  let b = new THREE.Box3().setFromObject(inner);
  const s = c.cm ? c.cm / 100 / (b.max.y - b.min.y) : 1;
  inner.scale.setScalar(s);
  b = new THREE.Box3().setFromObject(inner);
  const ctr = b.getCenter(new THREE.Vector3());
  inner.position.set(-ctr.x, -b.min.y, -ctr.z);
  const holder = new THREE.Group(); holder.add(inner); holder.rotation.y = c.yaw || 0; scene.add(holder);
  holder.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(holder), sz = bb.getSize(new THREE.Vector3());
  const half = Math.max(sz.x, sz.z, sz.y) * 0.9 + 0.05;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.01, 10);
  cam.position.set(0, sz.y / 2 + Math.sin(EL) * 3, Math.cos(EL) * 3); cam.lookAt(0, sz.y / 2, 0);
  cam.updateMatrixWorld();
  const px = Math.round(half * 2 * 100 * PPC);
  r.setSize(px, px);
  r.render(scene, cam);
  // crop to what was drawn (object and its shadow)
  const cv = document.createElement('canvas'); cv.width = px; cv.height = px;
  const cx = cv.getContext('2d'); cx.drawImage(r.domElement, 0, 0);
  const d = cx.getImageData(0, 0, px, px).data;
  let x0 = px, y0 = px, x1 = 0, y1 = 0;
  for (let y = 0; y < px; y++) for (let x = 0; x < px; x++) if (d[(y * px + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(px - 1, x1 + 2); y1 = Math.min(px - 1, y1 + 2);
  const toPx = (v) => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * px - x0, (1 - p.y) / 2 * px - y0]; };
  // where the piece stands: the front of its footprint
  const base = Math.max(...[[bb.min.x, bb.min.z], [bb.max.x, bb.min.z], [bb.min.x, bb.max.z], [bb.max.x, bb.max.z]].map(([x, z]) => toPx(new THREE.Vector3(x, 0, z))[1]));
  const item = { w: x1 - x0 + 1, h: y1 - y0 + 1, base: Math.min(y1 - y0 + 1, base), cm: [sz.x, sz.y, sz.z].map((v) => Math.round(v * 1000) / 10) };
  if (k === 'bookstack') {
    // the top cover, for something small to sit on
    const ys = [[bb.min.x, bb.max.z], [bb.max.x, bb.max.z]].map(([x, z]) => toPx(new THREE.Vector3(x, bb.max.y, z)));
    item.top = { y: Math.max(ys[0][1], ys[1][1]) - 3, x0: ys[0][0] + 10, x1: ys[1][0] - 10 };
  }
  const crop = document.createElement('canvas'); crop.width = item.w; crop.height = item.h;
  crop.getContext('2d').drawImage(cv, x0, y0, item.w, item.h, 0, 0, item.w, item.h);
  item.png = crop.toDataURL('image/png');
  out[k] = item;
  scene.remove(holder);
}
window.OUT = out; window.DONE = true;
</script></body></html>
